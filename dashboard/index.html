<!DOCTYPE html>
<html>
<head>
  <title>PiRC Dashboard</title>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>

<h2>PiRC Simulation Dashboard</h2>

<label>Nodes:</label>
<input id="nodes" value="1000"><br>

<label>Sybil Ratio:</label>
<input id="sybil" value="0.1"><br>

<label>Epochs:</label>
<input id="epochs" value="10"><br>

<button onclick="runSimulation()">Run Simulation</button>

<div id="chart"></div>

<script>
async function runSimulation() {
    const nodes = document.getElementById("nodes").value;
    const sybil = document.getElementById("sybil").value;
    const epochs = document.getElementById("epochs").value;

    const response = await fetch("/simulate-graph", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nodes: parseInt(nodes), sybil_ratio: parseFloat(sybil), epochs: parseInt(epochs) })
    });

    const data = await response.json();

    const epochs_arr = data.map(d => d.epoch);
    const honest_rewards = data.map(d => d.honest_avg);
    const sybil_rewards = data.map(d => d.sybil_avg);

    const trace1 = { x: epochs_arr, y: honest_rewards, mode: 'lines+markers', name: 'Honest' };
    const trace2 = { x: epochs_arr, y: sybil_rewards, mode: 'lines+markers', name: 'Sybil' };

    const layout = { title: 'Average Rewards per Epoch', xaxis: { title: 'Epoch' }, yaxis: { title: 'Average Reward' } };

    Plotly.newPlot('chart', [trace1, trace2], layout);
}
</script>

</body>
</html>
